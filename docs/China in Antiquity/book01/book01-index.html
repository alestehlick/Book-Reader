<!DOCTYPE html>
<html
  lang="en"
  data-book-js="book01-data-v2.js"
  data-book-json="book01-data-v2.json"
  data-book-data-preference="js"
  data-audio-dirs="../audio/paragraphs"
  data-figures-dir="../figures"
  data-maps-dir="maps"
  data-videos-dir="../videos"
  data-video-extensions="webm"
>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>1 — The Beginnings</title>
  <link rel="stylesheet" href="../styles.css?v=2" />
</head>
<body data-theme="dark">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Sections panel">
      <div class="sidebar-header">
        <a class="home-link" href="../index.html">← China in Antiquity</a>
        <div class="eyebrow">Read and listen</div>
        <h1 id="bookTitle">Loading…</h1>
      </div>

      <div class="sidebar-section">
        <div class="eyebrow">Sections</div>
        <nav id="sectionsNav" class="sections-nav"></nav>
      </div>
    </aside>

    <div id="sidebarBackdrop" class="sidebar-backdrop" hidden></div>

    <main class="main-panel">
      <header class="topbar card">
        <button id="toggleSidebarBtn" class="icon-btn" type="button" aria-label="Open sections" aria-expanded="false" aria-controls="sidebar">
          ☰
        </button>

        <div class="topbar-center">
          <div class="eyebrow">Now Reading</div>
          <div id="nowReadingTitle" class="topbar-title">—</div>
        </div>

        <button id="themeToggleBtn" class="icon-btn" type="button" aria-label="Toggle theme">
          ◐
        </button>
      </header>

      <section class="card player-card">
        <div class="player-meta">
          <div class="eyebrow" id="playerSectionLabel">Section — Paragraph</div>
          <h2 id="playerParagraphLabel" class="player-paragraph-label">—</h2>
          <div id="playerTimeRange" class="time-range">0:00</div>
        </div>

        <div class="player-controls-row">
          <button id="prevBtn" class="control-btn" type="button">Previous</button>
          <button id="playPauseBtn" class="control-btn primary" type="button">Play</button>
          <button id="nextBtn" class="control-btn" type="button">Next</button>
        </div>

        <div class="toggle-row">
          <label class="toggle-item">
            <input id="continuousToggle" type="checkbox" checked />
            <span>Continuous playback</span>
          </label>

          <input id="oneParagraphToggle" type="checkbox" checked hidden />
        </div>

        <div class="progress-wrap">
          <input id="progressBar" type="range" min="0" max="100" value="0" step="0.1" aria-label="Audio position" />
          <div class="progress-times">
            <span id="currentTimeLabel">0:00</span>
            <span id="durationLabel">0:00</span>
          </div>
        </div>
      </section>

      <section class="card current-card">
        <div class="eyebrow">Current Paragraph</div>
        <div id="currentParagraphText" class="current-paragraph-text">Loading…</div>
      </section>

      <section id="figuresSection" class="card media-card" hidden>
        <div class="media-header">
          <div class="media-header-main">
            <div class="eyebrow">Figures</div>
            <div id="figuresSummary" class="media-summary"></div>
          </div>
          <button id="figuresToggleBtn" class="media-toggle-btn" type="button" aria-label="Hide figures" aria-pressed="true">Hide</button>
        </div>

        <section id="figureGroup" class="media-group" hidden>
          <div class="media-group-title">Figures</div>
          <div id="paragraphFigures" class="media-stack"></div>
        </section>
      </section>

      <section id="mapsSection" class="card media-card maps-card" hidden>
        <div class="media-header">
          <div class="media-header-main">
            <div class="eyebrow">Maps</div>
            <div id="mapsSummary" class="media-summary"></div>
          </div>
          <button id="mapsToggleBtn" class="media-toggle-btn" type="button" aria-label="Hide maps" aria-pressed="true">Hide</button>
        </div>

        <section id="mapGroup" class="media-group" hidden>
          <div class="media-group-title">Maps</div>
          <div id="allMaps" class="media-stack"></div>
        </section>
      </section>

      <section id="contextGrid" class="context-grid">
        <article class="card context-card">
          <div class="eyebrow">Previous</div>
          <div id="previousParagraphText" class="context-text">—</div>
        </article>

        <article class="card context-card">
          <div class="eyebrow">Next</div>
          <div id="nextParagraphText" class="context-text">—</div>
        </article>
      </section>
    </main>
  </div>

  <audio id="audioPlayer" preload="metadata"></audio>

  <script src="book01-data-v2.js"></script>
  <script src="../app.js?v=2"></script>
</body>
</html>
